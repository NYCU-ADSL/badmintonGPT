<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="badmintonGPT — your badminton match assistant."
      data-i18n-meta="description"
    />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark-small-noframe-green.svg" />
    <link rel="apple-touch-icon" href="/brand/mark-green.svg" />
    <style>
      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #0a0a0a;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #1a1a1a;
        color: #fafafa;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.4s ease;
      }

      html.dark .boot-splash {
        background: #1a1a1a;
      }

      .boot-splash.boot-splash-leave {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        color: rgba(255, 255, 255, 0.74);
        font-size: 14px;
      }

      html:not(.dark) .boot-splash-inner {
        color: rgba(10, 10, 10, 0.64);
      }

      /* Lock-on mark animation (brand kit / images/animation/logo-animation.html):
         speed lines fly in → shuttle lands → lock frame snaps shut → idle breathe. */
      .boot-mark {
        width: min(36vmin, 150px);
        height: min(36vmin, 150px);
        overflow: visible;
      }

      @keyframes boot-slide-in {
        0% {
          transform: translateX(-72px);
          opacity: 0;
        }
        55% {
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes boot-shuttle-in {
        0% {
          transform: translateX(-96px);
          opacity: 0;
        }
        35% {
          opacity: 1;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes boot-snap {
        0% {
          transform: scale(1.75);
          opacity: 0;
        }
        55% {
          opacity: 1;
        }
        70% {
          transform: scale(0.93);
        }
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }

      .boot-line {
        animation: boot-slide-in 0.8s cubic-bezier(0.05, 0.85, 0.15, 1) both;
      }

      .boot-line2 {
        animation-delay: 0.14s;
      }

      .boot-line3 {
        animation-delay: 0.28s;
      }

      .boot-shuttle {
        animation: boot-shuttle-in 0.96s cubic-bezier(0.05, 0.85, 0.15, 1) 0.36s both;
      }

      .boot-frame {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          boot-snap 0.76s cubic-bezier(0.55, 0, 0.15, 1) 1.44s both,
          boot-breathe 2.6s ease-in-out 3.6s infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-line,
        .boot-shuttle,
        .boot-frame {
          animation: none;
          opacity: 1;
        }

        .boot-frame {
          opacity: 0.9;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nanobot-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <script>
      (function () {
        var localeKey = "nanobot.locale";
        var copy = {
          en: {
            boot: "Loading badmintonGPT…",
            description: "badmintonGPT — your badminton match assistant."
          },
          "zh-CN": {
            boot: "正在加载 badmintonGPT…",
            description: "badmintonGPT —— 你的羽毛球赛事助理。"
          },
          "zh-TW": {
            boot: "正在載入 badmintonGPT…",
            description: "badmintonGPT —— 你的羽球賽事助理。"
          },
          fr: {
            boot: "Chargement de badmintonGPT…",
            description: "badmintonGPT — votre assistant de matchs de badminton."
          },
          ja: {
            boot: "badmintonGPT を読み込み中…",
            description: "badmintonGPT — バドミントンの試合アシスタント。"
          },
          ko: {
            boot: "badmintonGPT 불러오는 중…",
            description: "badmintonGPT — 배드민턴 경기 어시스턴트."
          },
          es: {
            boot: "Cargando badmintonGPT…",
            description: "badmintonGPT: tu asistente de partidos de bádminton."
          },
          vi: {
            boot: "Đang tải badmintonGPT…",
            description: "badmintonGPT — trợ lý trận đấu cầu lông của bạn."
          },
          id: {
            boot: "Memuat badmintonGPT…",
            description: "badmintonGPT — asisten pertandingan bulu tangkis Anda."
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
          // This script runs in <head>, before <body> is parsed — defer the
          // boot-copy swap until the splash markup exists.
          var applyBootCopy = function () {
            var boot = document.querySelector("[data-boot-copy]");
            if (boot) boot.textContent = localized.boot;
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", applyBootCopy);
          } else {
            applyBootCopy();
          }
        } catch {}
      })();
    </script>
    <title>badmintonGPT</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <div class="boot-splash" id="boot-splash">
      <div class="boot-splash-inner">
        <svg
          class="boot-mark"
          viewBox="0 0 120 120"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <g transform="rotate(-12 60 60)">
            <line class="boot-line boot-line1" x1="30" y1="42" x2="74" y2="42" stroke="#3fc168" stroke-width="8" />
            <line class="boot-line boot-line2" x1="20" y1="60" x2="70" y2="60" stroke="#3fc168" stroke-width="8" />
            <g opacity="0.5">
              <line class="boot-line boot-line3" x1="34" y1="78" x2="70" y2="78" stroke="#3fc168" stroke-width="8" />
            </g>
            <circle class="boot-shuttle" cx="95" cy="60" r="11" fill="#3fc168" />
            <path class="boot-frame" d="M75 48 V40 H83 M107 40 H115 V48 M75 72 V80 H83 M107 80 H115 V72" stroke="#3fc168" stroke-width="5" />
          </g>
        </svg>
        <span data-boot-copy>Loading badmintonGPT…</span>
      </div>
    </div>
    <script>
      // The splash is a fixed overlay above #root, so React mounting cannot
      // cut the intro off. It leaves only after BOTH the lock-on intro has
      // played once (the frame's boot-snap animation ends) AND the app has
      // mounted into #root.
      (function () {
        var splash = document.getElementById("boot-splash");
        var root = document.getElementById("root");
        if (!splash || !root) return;

        var reduced = false;
        try {
          reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch {}

        var introDone = reduced;
        var appMounted = false;
        var leaving = false;

        function leave() {
          if (leaving) return;
          leaving = true;
          if (reduced) {
            splash.remove();
            return;
          }
          splash.classList.add("boot-splash-leave");
          splash.addEventListener(
            "transitionend",
            function () {
              splash.remove();
            },
            { once: true }
          );
          // Safety net in case transitionend never fires.
          setTimeout(function () {
            if (splash.parentNode) splash.remove();
          }, 700);
        }

        function maybeLeave() {
          if (introDone && appMounted) leave();
        }

        splash.addEventListener("animationend", function (event) {
          if (event.animationName === "boot-snap") {
            introDone = true;
            maybeLeave();
          }
        });
        // Safety net: the intro ends at ~2.2s; never hold the app past 2.8s.
        setTimeout(function () {
          introDone = true;
          maybeLeave();
        }, 2800);

        if (root.childElementCount > 0) {
          appMounted = true;
          maybeLeave();
        } else {
          new MutationObserver(function (mutations, observer) {
            if (root.childElementCount > 0) {
              appMounted = true;
              observer.disconnect();
              maybeLeave();
            }
          }).observe(root, { childList: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
